include colorschemes/darker.conf

font_family          IosevkaTerm Nerd Font Mono
bold_font            auto
italic_font          auto
bold_italic_font     auto
font_size            11.0

cursor_shape           block
cursor_blink_interval  0

scrollback_lines         20000
scrollback_pager         /usr/bin/less
wheel_scroll_multiplier  5.0

url_style      double
open_url_with  firefox

copy_on_select             yes
select_by_word_characters  :@-./_~?&=%+#

click_interval       0.5
mouse_hide_wait      0.0
focus_follows_mouse  no

repaint_delay         10
input_delay           1
sync_to_monitor       yes
visual_bell_duration  0.0
enable_audio_bell     no

linux_display_server   wayland
placement_strategy  top-left
remember_window_size   no
initial_window_width   1200
initial_window_height  700
window_border_width    0
window_margin_width    8
window_padding_width   0
background_opacity     1.0

enabled_layouts  stack
tab_bar_style    hidden

map ctrl+shift+enter  no_op
map ctrl+shift+]      no_op
map ctrl+shift+[      no_op
map ctrl+shift+f      no_op
map ctrl+shift+b      no_op
map ctrl+shift+`      no_op
map ctrl+shift+r      no_op
map ctrl+shift+l      no_op
map ctrl+shift+t      no_op
map ctrl+shift+q      no_op
map ctrl+shift+right  no_op
map ctrl+shift+left   no_op
map ctrl+tab          no_op
map ctrl+shift+tab    no_op
map ctrl+shift+.      no_op
map ctrl+shift+,      no_op
map ctrl+shift+alt+t  no_op

shell_integration     no-cursor
shell                 .
close_on_child_death  no
allow_remote_control  no
term                  xterm-kitty
